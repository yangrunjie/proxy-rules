# 国内高校网站根域。后缀匹配会覆盖官网、研究生院、研招网和校内服务子域名
  - edu.cn
  - hit.edu.cn
  - hrbeu.edu.cn

# 用户明确要求全部国内高校网站直连时，额外启用该广泛后缀；只点名学校时不要启用
broad_domestic_university_suffixes:
  - edu.cn

# WOS/Clarivate 或高校网站需要完全绕过系统代理时使用；不影响 Google Scholar 代理
system_proxy_bypass_domains:
  - webofscience.com
  - "*.webofscience.com"
  - clarivate.com
  - "*.clarivate.com"
  - edu.cn
  - "*.edu.cn"

# 已核对的高校官方站点示例，供生成适配规则时审计
domestic_university_examples:
  hit:
    root: hit.edu.cn
    official_sites:
      - www.hit.edu.cn
      - hitgs.hit.edu.cn
      - yzb.hit.edu.cn
  hrbeu:
    root: hrbeu.edu.cn
    official_sites:
      - www.hrbeu.edu.cn
      - yjsy.hrbeu.edu.cn
      - yjs.hrbeu.edu.cn
